<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>BPMN Phase D E2E</title>
<style>body{margin:0;font-family:system-ui;background:#FFF4DE}#host{width:1280px;height:720px;border:1px solid #ccc}#log{padding:8px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#fff;max-height:300px;overflow:auto}.pass{color:#0a0}.fail{color:#c00;font-weight:600}</style>
<link rel="stylesheet" href="../styles.css"/></head><body>
<div id="host" class="da-board-view"></div><div id="log"></div>
<script src="../harness/harness.js?v=phaseD1"></script>
<script>
const log = document.getElementById('log');
const w = (s, c='') => { const d=document.createElement('div'); if(c)d.className=c; d.textContent=s; log.appendChild(d); };
const results = [];
async function run(name, fn) {
  try { const out = await fn(); results.push({name, ok:true, info: out||''}); w(`✅ ${name}  ${out||''}`, 'pass'); }
  catch(e) { results.push({name, ok:false, err: String(e?.message||e)}); w(`❌ ${name}  ${e?.message||e}`, 'fail'); }
}
const a = (c, m) => { if (!c) throw new Error(m); };

const H = '<?xml version="1.0" encoding="UTF-8"?><bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:bioc="http://bpmn.io/schema/bpmn/biocolor/1.0" id="d" targetNamespace="x">';

const DOC_BIOC = H + `<bpmn:process id="P"><bpmn:task id="t" name="Pay"><bpmn:documentation>Pay invoice carefully.</bpmn:documentation></bpmn:task></bpmn:process><bpmndi:BPMNDiagram><bpmndi:BPMNPlane bpmnElement="P"><bpmndi:BPMNShape bpmnElement="t" bioc:fill="#bbdefb" bioc:stroke="#1565c0"><dc:Bounds x="100" y="100" width="120" height="60"/></bpmndi:BPMNShape></bpmndi:BPMNPlane></bpmndi:BPMNDiagram></bpmn:definitions>`;

const CAMUNDA_XML = '<?xml version="1.0" encoding="UTF-8"?><bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:camunda="http://camunda.org/schema/1.0/bpmn" id="d" targetNamespace="x"><bpmn:process id="P"><bpmn:userTask id="t" name="Review" camunda:assignee="john" camunda:formKey="forms/review"><bpmn:extensionElements><camunda:properties><camunda:property name="priority" value="high"/></camunda:properties></bpmn:extensionElements></bpmn:userTask></bpmn:process><bpmndi:BPMNDiagram><bpmndi:BPMNPlane bpmnElement="P"><bpmndi:BPMNShape bpmnElement="t"><dc:Bounds x="0" y="0" width="100" height="60"/></bpmndi:BPMNShape></bpmndi:BPMNPlane></bpmndi:BPMNDiagram></bpmn:definitions>';

async function runAll() {
  await run('D1 import docs + bioc → bpmnDoc + node colour in attrs.style', async () => {
    const r = await window.__import.bpmn(DOC_BIOC);
    const m = window.__ob.getModel();
    const t = m.nodes.find(n=>n.id==='t');
    a(t?.attrs?.bpmnDoc === 'Pay invoice carefully.', `doc=${t?.attrs?.bpmnDoc}`);
    a(t?.attrs?.style?.fill === '#bbdefb', `fill=${t?.attrs?.style?.fill}`);
    a(t?.attrs?.style?.stroke === '#1565c0', `stroke=${t?.attrs?.style?.stroke}`);
    return `doc+bioc ok`;
  });

  await run('D2 bioc round-trip — user changes fill → XML gets bioc:fill', async () => {
    const r = await window.__import.bpmn(DOC_BIOC);
    const m = window.__ob.getModel();
    m.nodes.find(n=>n.id==='t').attrs.style = { fill: '#ff0000' };
    const xml = await window.__export.bpmn(m, r.sourceMeta);
    a(/bioc:fill="#ff0000"/.test(xml), `no bioc:fill in XML: ${xml.match(/bioc:[^"]+="[^"]*"/g)}`);
    return `bioc:fill="#ff0000" emitted`;
  });

  await run('D3 docs round-trip — user edits doc → XML gets <documentation>', async () => {
    const r = await window.__import.bpmn(DOC_BIOC);
    const m = window.__ob.getModel();
    m.nodes.find(n=>n.id==='t').attrs.bpmnDoc = 'Updated doc.';
    const xml = await window.__export.bpmn(m, r.sourceMeta);
    a(/<bpmn:documentation>Updated doc\.<\/bpmn:documentation>/.test(xml), 'no documentation element');
    return 'documentation updated';
  });

  await run('D4 import camunda:assignee/formKey → node.attrs.camunda', async () => {
    await window.__import.bpmn(CAMUNDA_XML);
    const m = window.__ob.getModel();
    const t = m.nodes.find(n=>n.id==='t');
    a(t?.attrs?.camunda?.assignee === 'john', `assignee=${t?.attrs?.camunda?.assignee}`);
    a(t?.attrs?.camunda?.formKey === 'forms/review', `formKey=${t?.attrs?.camunda?.formKey}`);
    return `assignee=john formKey=forms/review`;
  });

  await run('D5 bpmnProps from camunda:property elements', async () => {
    await window.__import.bpmn(CAMUNDA_XML);
    const m = window.__ob.getModel();
    const t = m.nodes.find(n=>n.id==='t');
    const props = t?.attrs?.bpmnProps;
    a(Array.isArray(props) && props.length > 0, `bpmnProps=${JSON.stringify(props)}`);
    a(props[0].name === 'priority' && props[0].value === 'high', `props[0]=${JSON.stringify(props[0])}`);
    return `{priority: high}`;
  });

  await run('D6 BPMN props panel renders for bpmn-task', async () => {
    await window.__import.bpmn(DOC_BIOC);
    await new Promise(r => setTimeout(r, 100));
    // Select the task node
    const ob = window.__ob;
    const cell = ob.graph.getCellById('t');
    ob.graph.select(cell);
    await new Promise(r => setTimeout(r, 100));
    // One colour: no separate "Màu BPMN"; the file's bioc:fill shows in "Kiểu" as the picked colour
    const secHeaders = [...document.querySelectorAll('.lk-psec-h')].map(e=>e.textContent);
    a(!secHeaders.some(h => h?.includes('Màu BPMN')), `sections: ${secHeaders.join(',')}`);
    a(secHeaders.some(h => h?.includes('documentation')), `sections: ${secHeaders.join(',')}`);
    a(secHeaders.includes('Camunda') && secHeaders.includes('Metadata JSON'), `sections: ${secHeaders.join(',')}`);
    const pick = document.querySelector('.lk-props-body .lk-pswatch-pick.on');
    a(pick?.value === '#bbdefb', `fill picker: ${pick?.value}`);
    return `sections: ${secHeaders.join(', ')}`;
  });

  await run('D7 picking a colour in Kiểu exports it as bioc:fill', async () => {
    const r = await window.__import.bpmn(DOC_BIOC);
    await new Promise(r => setTimeout(r, 100));
    window.__ob.graph.resetSelection([window.__ob.graph.getCellById('t')]);
    await new Promise(r => setTimeout(r, 100));
    const pick = document.querySelector('.lk-props-body .lk-pswatch-pick');
    pick.value = '#00aa55'; pick.dispatchEvent(new Event('change'));
    const m = window.__ob.getModel();
    a(m.nodes.find(n=>n.id==='t').attrs.style.fill === '#00aa55', 'style.fill not set');
    const xml = await window.__export.bpmn(m, r.sourceMeta);
    a(/bioc:fill="#00aa55"/.test(xml) && !/bioc:fill="#bbdefb"/.test(xml), `xml: ${xml.match(/bioc:[^"]+="[^"]*"/g)}`);
    return 'bioc:fill="#00aa55"';
  });

  await run('D8 several nodes selected: Kiểu applies to all of them', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'm1', shape: 'bpmn-task', x: 100, y: 100, width: 100, height: 80, label: 'A' },
      { id: 'm2', shape: 'bpmn-gateway-xor', x: 300, y: 115, width: 50, height: 50 },
    ], edges: [] });
    await new Promise(r => setTimeout(r, 100));
    const g = window.__ob.graph;
    g.resetSelection([g.getCellById('m1'), g.getCellById('m2')]);
    await new Promise(r => setTimeout(r, 100));
    const h = document.querySelector('.lk-props-body .lk-psec-h')?.textContent;
    a(h === 'Kiểu · 2 phần tử', `header: ${h}`);
    document.querySelectorAll('.lk-props-body .lk-pswatches')[0].children[4].click();
    const fills = window.__ob.getModel().nodes.map(n => n.attrs?.style?.fill);
    a(fills.every(f => f === '#D6EFE0'), `fills: ${fills}`);
    return 'both #D6EFE0';
  });

  await run('D9 + Thêm camunda:property adds a row that lands in the model', async () => {
    await window.__import.bpmn(CAMUNDA_XML);
    await new Promise(r => setTimeout(r, 100));
    window.__ob.graph.resetSelection([window.__ob.graph.getCellById('t')]);
    await new Promise(r => setTimeout(r, 100));
    [...document.querySelectorAll('.lk-props-body .lk-padd')].find(b => b.textContent.includes('camunda:property')).click();
    await new Promise(r => setTimeout(r, 50));
    const props = window.__ob.getModel().nodes.find(n=>n.id==='t').attrs.bpmnProps;
    a(props.length === 2 && props[1].name === 'property', `props: ${JSON.stringify(props)}`);
    return JSON.stringify(props);
  });

  const passed = results.filter(r=>r.ok).length;
  w('', '');
  w(`SUMMARY: ${passed}/${results.length} passed`, passed===results.length ? 'pass' : 'fail');
  window.__results = { passed, failed: results.length-passed, total: results.length, results };
}
runAll().then(()=>{ window.__done = true; });
</script></body></html>
