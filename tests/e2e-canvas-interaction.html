<!DOCTYPE html><html><head><meta charset="utf-8"/>
<title>Canvas interaction</title>
<style>
:root{--font-interface:system-ui;}
body{margin:0;font-family:system-ui,sans-serif;background:#FFF4DE;}
#host{width:1200px;height:520px;border:1px solid #ccc;}
#log{padding:8px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#fff;border-top:1px solid #ccc;max-height:300px;overflow:auto}
.pass{color:#0a0}.fail{color:#c00;font-weight:600}
</style>
<link rel="stylesheet" href="../styles.css"/>
</head><body>
<div id="host" class="da-board-view"></div>
<div id="log"></div>
<script src="../harness/harness.js?v=merge30b"></script>
<script>
// Multi-select drag moves each node once per tick; ports are easy to grab.
// Serve the repo root (python3 -m http.server) and open tests/e2e-canvas-interaction.html.
// A hidden / background tab never runs requestAnimationFrame, so the context bar
// (drawn on the next frame) never shows and every button lookup fails. Frames on
// a timer keep the suite independent of whether the page is on screen.
window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
window.cancelAnimationFrame = (id) => clearTimeout(id);
const log = document.getElementById('log');
const w = (s, cls='') => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = s; log.appendChild(d); };
const results = [];
async function run(name, fn) {
  try { const out = await fn(); results.push({name, ok:true}); w(`✅ ${name}  ${out||''}`, 'pass'); }
  catch(e) { results.push({name, ok:false, err: String(e?.message||e)}); w(`❌ ${name}  ${e?.message||e}`, 'fail'); console.error(name, e); }
}
function assert(cond, msg) { if (!cond) throw new Error('assert: '+msg); }
const tick = (ms = 120) => new Promise(r => setTimeout(r, ms));
const t = (id, x, y) => ({ id, shape: 'bpmn-task-user', x, y, width: 100, height: 60, label: id });

(async () => {
  const g = () => window.__ob.graph;
  const cell = (id) => g().getCellById(id);

  await run('dragging one of 3 selected nodes moves each of them exactly once', async () => {
    window.__ob.loadModel({ nodes: [t('a', 100, 100), t('b', 300, 100), t('c', 500, 100), t('d', 300, 300)],
      edges: [{ id: 'ab', source: 'a', target: 'b' }, { id: 'bc', source: 'b', target: 'c' }] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    g().resetSelection(['a', 'b', 'c'].map(cell));
    const sets = {};
    const onPos = ({ node }) => { sets[node.id] = (sets[node.id] || 0) + 1; };
    g().on('node:change:position', onPos);
    // what X6's node drag does for one pointer move of the dragged node
    cell('b').setPosition(300, 140, { ui: true, translateBy: 'b' });
    g().off('node:change:position', onPos);
    assert(sets.a === 1 && sets.b === 1 && sets.c === 1 && !sets.d, 'position sets per node: ' + JSON.stringify(sets));
    const ys = ['a', 'b', 'c', 'd'].map((id) => cell(id).getPosition().y);
    assert(JSON.stringify(ys) === JSON.stringify([140, 140, 140, 300]), 'y after move: ' + ys);
    return JSON.stringify(sets);
  });

  await run('a port can be grabbed a few px off its centre', async () => {
    window.__ob.loadModel({ nodes: [t('portnode', 200, 200)], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const c = document.querySelector('[data-cell-id="portnode"] circle[port="right"]');
    c.style.visibility = 'visible';          // as on hover
    const r = c.getBoundingClientRect();
    const cx = r.x + r.width / 2, cy = r.y + r.height / 2;
    for (const [dx, dy] of [[6, 0], [-6, 0], [0, 6], [4, -4]]) {
      const el = document.elementFromPoint(cx + dx, cy + dy);
      assert(el?.getAttribute('port') === 'right', `(${dx},${dy}) off centre hits ${el?.tagName}`);
    }
    c.style.visibility = '';
    return `grab Ø ${Math.round(r.width)}px`;
  });

  await run('two loads in a row (board opened / file reloaded) never freeze rendering', async () => {
    // X6 renders asynchronously. A load right after another one used to leave
    // the previous edges' render jobs queued; they ran after the cells were
    // cleared and threw for an edge whose source node is gone — which stopped
    // X6 rendering for good (canvas frozen, right-click dead).
    const errs = []; const onErr = (e) => errs.push(e.message);
    window.addEventListener('error', onErr);
    window.__ob.loadModel({ nodes: [t('n1', 100, 100), t('n2', 300, 100)], edges: [{ id: 'f1', source: 'n1', target: 'n2' }] });
    window.__ob.loadModel({ nodes: [t('m1', 100, 300), t('n2', 300, 100)], edges: [{ id: 'f1', source: 'm1', target: 'n2' }] });
    await tick(300);
    window.__ob.loadModel({ nodes: [t('alive', 500, 300)], edges: [] });
    await tick(300);
    window.removeEventListener('error', onErr);
    assert(!errs.length, 'render error: ' + errs[0]);
    assert(document.querySelector('[data-cell-id="alive"]'), 'canvas stopped rendering');
  });

  await run('one failing render job never stops later rendering', async () => {
    window.__ob.loadModel({ nodes: [t('mover', 300, 300)], edges: [] });
    await tick(300);
    const queue = window.__ob.graph.renderer.schedule.queue;
    const onErr = (e) => e.preventDefault();
    window.addEventListener('error', onErr);
    queue.queueJob({ id: 'boom', priority: 1 << 1, cb: () => { throw new Error('test: bad render job'); } });
    queue.queueFlush();
    await tick(100);
    // an ordinary edit (no loadModel) must still reach the screen
    g().addNode({ id: 'added-later', shape: 'rect', x: 600, y: 100, width: 40, height: 40 });
    await tick(300);
    window.removeEventListener('error', onErr);
    assert(document.querySelector('[data-cell-id="added-later"]'), 'canvas stopped rendering after a failing job (stuck: ' + queue.isFlushing + ')');
  });

  await run('an external label keeps its flipped side after the node is re-rendered (label edit)', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'lt1', shape: 'bpmn-task-user', x: 100, y: 330, width: 120, height: 80, label: 'Ghi số' },
      { id: 'ld1', shape: 'bpmn-data-object', x: 300, y: 140, width: 40, height: 60, label: 'Số điện thoại / Zalo' },
    ], edges: [{ id: 'lx1', source: 'lt1', sourcePort: 'right', target: 'ld1', targetPort: 'bottom', kind: 'association' }] });
    await tick(300);
    const cls = () => document.querySelector('[data-cell-id="ld1"] .bp-dataobj').className;
    assert(/label-top/.test(cls()), 'label not flipped above to begin with: ' + cls());
    const n = cell('ld1');
    n.setData({ ...n.getData(), label: 'Số điện thoại' });
    window.__ob.rerender(n);
    await tick(300);
    assert(/label-top/.test(cls()), 'flip lost after re-render: ' + cls());
  });

  await run('resizing a pool by its bottom edge grows only the last lane', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'rpool', shape: 'bpmn-pool', x: 40, y: 40, width: 700, height: 300, label: 'KALIX',
        attrs: { lanes: [{ id: 'r1', label: 'A' }, { id: 'r2', label: 'B' }, { id: 'r3', label: 'C' }] } },
    ], edges: [] });
    await tick(300);
    cell('rpool').resize(700, 400, { ui: true, direction: 'bottom' });   // what dragging the bottom handle does
    await tick(200);
    const hs = cell('rpool').getData().lanes.map((l) => l.height);
    assert(JSON.stringify(hs) === JSON.stringify([100, 100, 200]), 'lane heights: ' + hs);
    const dom = [...document.querySelectorAll('[data-cell-id="rpool"] .bp-pool-lane')].map((l) => Math.round(l.getBoundingClientRect().height / window.__ob.graph.scale().sy));
    assert(Math.abs(dom[0] - 100) <= 2 && Math.abs(dom[2] - 200) <= 2, 'drawn lanes: ' + dom);
  });

  await run('source end dropped on a pool → message flow from its border; on blank → back where it was', async () => {
    const load = () => window.__ob.loadModel({ nodes: [
      { id: 'sp_khach', shape: 'bpmn-pool', x: 40, y: 20, width: 760, height: 100, label: 'Khách', attrs: { blackBox: true } },
      { id: 'sp_recv', shape: 'bpmn-task-receive', x: 300, y: 320, width: 100, height: 80, label: 'Nhận tin' },
      { id: 'sp_other', shape: 'bpmn-task-user', x: 600, y: 320, width: 100, height: 80, label: 'Khác' },
    ], edges: [{ id: 'sp_m', source: 'sp_other', sourcePort: 'left', target: 'sp_recv', targetPort: 'right' }] });
    const mount = document.querySelector('.lk-graph-mount');
    // what dragging the source arrowhead does: the source leaves its port…
    load(); await tick(300);
    cell('sp_m').setSource({ x: 350, y: 70 });                  // …and is dropped on the black-box pool
    mount.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await tick(100);
    const m = window.__ob.getModel().edges.find((e) => e.id === 'sp_m');
    assert(m.source === 'sp_khach' && m.kind === 'message', 'pool drop: ' + JSON.stringify(m));
    load(); await tick(300);
    cell('sp_m').setSource({ x: 700, y: 600 });                 // dropped on blank canvas
    mount.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await tick(100);
    const src = cell('sp_m').getSource();
    assert(src.cell === 'sp_other' && src.port === 'left', 'blank drop: ' + JSON.stringify(src));
  });

  await run('a message flow end dropped on a pool lands straight above where the arrow leaves the task, not above its centre', async () => {
    const load = () => window.__ob.loadModel({ nodes: [
      { id: 'vp_khach', shape: 'bpmn-pool', x: 32, y: 0, width: 2350, height: 120, label: 'Khách', attrs: { blackBox: true } },
      { id: 'vp_task', shape: 'bpmn-task-user', x: 1660, y: 1260, width: 100, height: 80, label: 'Nhắn Zalo' },
    ], edges: [{ id: 'vp_m', source: 'vp_task', target: 'vp_khach', sourceAnchor: { dx: 90, dy: 0 }, targetAnchor: { dx: 1678, dy: 120 }, router: 'normal', kind: 'message' }] });
    const mount = document.querySelector('.lk-graph-mount');
    const xs = () => { const v = g().findViewByCell(cell('vp_m')); return [v.sourcePoint.x, v.targetPoint.x]; };
    load(); await tick(300);
    cell('vp_m').setTarget({ x: 1760, y: 110 });                 // pool end dragged onto the pool
    mount.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await tick(150);
    let [sx, tx] = xs();
    assert(Math.abs(sx - tx) < 0.5, 'pool end dropped: task end x ' + sx + ' vs pool end x ' + tx);
    load(); await tick(300);
    cell('vp_m').setSource({ cell: 'vp_task', port: 'top-1' }); // task end moved to another port
    await tick(150);
    [sx, tx] = xs();
    assert(Math.abs(sx - tx) < 0.5, 'task end moved: task end x ' + sx + ' vs pool end x ' + tx);
  });

  await run('renaming an event / gateway / data store edits below the icon (bpmn-js), a task inside its box', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'lb_gw', shape: 'bpmn-gateway-x', x: 100, y: 100, width: 50, height: 50, label: '' },
      { id: 'lb_ev', shape: 'bpmn-start', x: 300, y: 107, width: 36, height: 36, label: 'Bắt đầu' },
      { id: 'lb_ds', shape: 'bpmn-data-store', x: 450, y: 100, width: 50, height: 50, label: '' },
      { id: 'lb_tk', shape: 'bpmn-task-user', x: 600, y: 90, width: 100, height: 80, label: 'Task' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const root = document.querySelector('.lk-root').getBoundingClientRect();
    for (const id of ['lb_gw', 'lb_ev', 'lb_ds', 'lb_tk']) {
      window.__ob.editLabel(cell(id));
      await tick(50);
      const ta = [...document.querySelectorAll('.lk-label-input')].pop();
      const top = ta.getBoundingClientRect().top - root.top;
      const b = cell(id).getBBox();
      ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await tick(50);
      if (id === 'lb_tk') assert(Math.abs(top - b.y) < 3, 'task editor not on its box: ' + top);
      else assert(top >= b.y + b.height, id + ' editor covers the icon: top ' + top + ' < ' + (b.y + b.height));
    }
  });

  // Does any segment of the edge's drawn route cross the box?
  const routeCrosses = (edgeId, box) => {
    const view = g().findViewByCell(cell(edgeId));
    const pts = [view.sourcePoint, ...(view.routePoints || []), view.targetPoint];
    const inside = (p) => p.x > box.x + 1 && p.x < box.x + box.width - 1 && p.y > box.y + 1 && p.y < box.y + box.height - 1;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      for (let k = 0; k <= 20; k++) {
        if (inside({ x: a.x + (b.x - a.x) * k / 20, y: a.y + (b.y - a.y) * k / 20 })) return true;
      }
    }
    return false;
  };

  await run('a new arrow routes around a shape in its way (router avoid)', async () => {
    window.__ob.loadModel({ nodes: [
      t('ra', 100, 200), t('rmid', 320, 190), t('rb', 560, 200),
      { id: 'rpool', shape: 'bpmn-pool', x: 40, y: 120, width: 760, height: 260, label: 'P', attrs: { lanes: [{ id: 'rl', label: 'L' }] } },
    ], edges: [{ id: 'rab', source: 'ra', sourcePort: 'right', target: 'rb', targetPort: 'left' }] });
    await tick(400);
    assert(!routeCrosses('rab', cell('rmid').getBBox()), 'route crosses the shape in between');
    const r = cell('rab').getRouter();
    assert((r?.name ?? r) === 'avoid', 'default router: ' + JSON.stringify(r));
  });

  await run('narrow gap: still around, not through', async () => {
    // the straight line (y = 230) runs through nmid; the gap under it is only 10px
    window.__ob.loadModel({ nodes: [t('na', 100, 200), t('nmid', 320, 185), t('nmid2', 320, 255), t('nb', 560, 200)],
      edges: [{ id: 'nab', source: 'na', sourcePort: 'right', target: 'nb', targetPort: 'left' }] });
    await tick(400);
    assert(!routeCrosses('nab', cell('nmid').getBBox()) && !routeCrosses('nab', cell('nmid2').getBBox()), 'route crosses a shape');
  });

  await run('an arrow with hand-made bends keeps exactly those bends', async () => {
    window.__ob.loadModel({ nodes: [t('va', 100, 200), t('vb', 560, 200)],
      edges: [{ id: 'vab', source: 'va', sourcePort: 'right', target: 'vb', targetPort: 'left', vertices: [{ x: 300, y: 100 }, { x: 450, y: 100 }] }] });
    await tick(400);
    const view = g().findViewByCell(cell('vab'));
    const pts = (view.routePoints || []).map((p) => `${Math.round(p.x)},${Math.round(p.y)}`);
    assert(pts.includes('300,100') && pts.includes('450,100'), 'route ignores the bends: ' + pts);
  });

  await run('vertical pool: lanes are columns, shapes get the column under them', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'vpool', shape: 'bpmn-pool', x: 40, y: 40, width: 600, height: 400, label: 'KALIX',
        attrs: { poolHorizontal: false, lanes: [{ id: 'vc1', label: 'Khách', width: 150 }, { id: 'vc2', label: 'Trực page', width: 300 }, { id: 'vc3', label: 'Sale', width: 150 }] } },
      { id: 'vt', shape: 'bpmn-task-user', x: 300, y: 200, width: 100, height: 60, label: 'x' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const ws = [...document.querySelectorAll('[data-cell-id="vpool"] .bp-pool-lane')].map((l) => Math.round(l.getBoundingClientRect().width));
    assert(Math.abs(ws[0] - 150) <= 2 && Math.abs(ws[1] - 300) <= 2 && Math.abs(ws[2] - 150) <= 2, 'column widths: ' + ws);
    const lane = window.__ob.getModel().nodes.find((n) => n.id === 'vt').laneId;
    assert(lane === 'vc2', 'laneId by x: ' + lane);   // centre x 350 → 40+150 .. 40+450
  });

  await run('nested lanes: child lanes drawn inside their parent, shapes get the leaf lane', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'npool', shape: 'bpmn-pool', x: 40, y: 40, width: 700, height: 400, label: 'Fanpage',
        attrs: { lanes: [{ id: 'n_kh', label: 'Khách', height: 100 },
                         { id: 'n_kalix', label: 'KALIX', height: 300, lanes: [{ id: 'n_tp', label: 'Trực page', height: 200 }, { id: 'n_sale', label: 'Sale', height: 100 }] }] } },
      { id: 'nt', shape: 'bpmn-task-user', x: 300, y: 370, width: 100, height: 50, label: 'Gọi' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const h = (id) => Math.round(document.querySelector(`[data-cell-id="npool"] [data-lane-id="${id}"]`).getBoundingClientRect().height);
    assert(Math.abs(h('n_tp') - 200) <= 2 && Math.abs(h('n_sale') - 100) <= 2, 'child heights: ' + [h('n_tp'), h('n_sale')]);
    const lane = window.__ob.getModel().nodes.find((n) => n.id === 'nt').laneId;
    assert(lane === 'n_sale', 'leaf lane: ' + lane);    // centre y 395 → 40+100+200 .. 440
  });

  await run('lanes nested 3 deep: drawn, divider drag at depth 3, menu splits a child lane', async () => {
    window.__ob.loadModel({ nodes: [
      { id: 'dpool', shape: 'bpmn-pool', x: 40, y: 40, width: 700, height: 400, label: 'Fanpage',
        attrs: { lanes: [{ id: 'd_kh', label: 'Khách', height: 100 },
                         { id: 'd_kalix', label: 'KALIX', height: 300, lanes: [
                           { id: 'd_vh', label: 'Vận hành', height: 200, lanes: [{ id: 'd_a', label: 'A', height: 120 }, { id: 'd_b', label: 'B', height: 80 }] },
                           { id: 'd_kt', label: 'Kỹ thuật', height: 100 }] }] } },
      { id: 'dt', shape: 'bpmn-task-user', x: 300, y: 215, width: 100, height: 50, label: 'x' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const h = (id) => Math.round(document.querySelector(`[data-cell-id="dpool"] [data-lane-id="${id}"]`).getBoundingClientRect().height);
    assert(Math.abs(h('d_a') - 120) <= 2 && Math.abs(h('d_b') - 80) <= 2, 'depth-3 heights: ' + [h('d_a'), h('d_b')]);
    assert(window.__ob.getModel().nodes.find((n) => n.id === 'dt').laneId === 'd_a', 'leaf lane at depth 3');
    const handle = document.querySelector('[data-cell-id="dpool"] [data-lane-path="1/0/0"]');
    assert(handle, 'divider between the depth-3 lanes');
    const r = handle.getBoundingClientRect();
    const ev = (type, y) => new PointerEvent(type, { bubbles: true, clientX: r.x + r.width / 2, clientY: y, pointerId: 1, pointerType: 'mouse' });
    handle.dispatchEvent(ev('pointerdown', r.y + r.height / 2));
    document.dispatchEvent(ev('pointermove', r.y + r.height / 2 + 30));
    document.dispatchEvent(ev('pointerup', r.y + r.height / 2 + 30));
    await tick(300);
    assert(Math.abs(h('d_a') - 150) <= 3 && Math.abs(h('d_b') - 50) <= 3, 'after drag: ' + [h('d_a'), h('d_b')]);
    assert(h('d_vh') >= 198 && h('d_vh') <= 202, 'parent band unchanged: ' + h('d_vh'));
    window.__ob.showLaneMenu(cell('dpool'), 'd_b', 10, 10);
    const items = [...window.__ob.popupLayer.querySelectorAll('.lk-menu-item')];
    assert(items.some((i) => /Chia/.test(i.textContent)) && items.some((i) => /Xoá lane con/.test(i.textContent)), 'menu: ' + items.map((i) => i.textContent));
    items.find((i) => /Chia/.test(i.textContent)).click();
    await tick(300);
    const deep = window.__ob.getModel().nodes.find((n) => n.id === 'dpool').attrs.lanes[1].lanes[0].lanes[1];
    assert(deep.lanes?.length === 2, 'd_b split into two: ' + JSON.stringify(deep));
  });

  await run('a sub-process inside a pool is on top of it: a click selects the sub-process', async () => {
    // Pools and sub-processes were both sent to z -1000, so the pool (drawn
    // later) covered the sub-process: clicks and drags went to the pool.
    window.__ob.loadModel({ nodes: [
      { id: 'zpool', shape: 'bpmn-pool', x: 40, y: 40, width: 700, height: 300, label: 'KALIX', attrs: { lanes: [{ id: 'z1', label: 'A' }] } },
      { id: 'zsub', shape: 'bpmn-subprocess', x: 200, y: 120, width: 200, height: 120, label: 'Sub' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const hitAt = () => {
      const r = document.querySelector('[data-cell-id="zsub"]').getBoundingClientRect();
      return document.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2)?.closest('[data-cell-id]')?.getAttribute('data-cell-id');
    };
    assert(hitAt() === 'zsub', 'loaded: centre hits ' + hitAt());
    // one added after the pool, the way the palette adds it
    g().removeCell('zsub');
    window.__ob.addHtmlNode('bpmn-subprocess', 200, 120, 200, 120, 'Sub', undefined, 'zsub');
    await tick(300);
    assert(hitAt() === 'zsub', 'added: centre hits ' + hitAt());
  });

  await run('a selected pool shows no "+ next shape" buttons on its border', async () => {
    g().resetSelection([cell('zpool')]);
    await tick(100);
    const layer = window.__ob.padLayer;
    assert(!layer || layer.style.display === 'none' || !layer.children.length, 'pad shown: ' + layer?.children.length);
    g().resetSelection([cell('zsub')]);
    await tick(100);
    assert(layer && layer.style.display !== 'none' && layer.children.length, 'sub-process lost its pad');
  });

  await run('an open arrowhead ends at the shape edge, not inside it', async () => {
    // X6 centres a path marker on the line end unless told otherwise; ours are
    // drawn with the tip at x = 0, so the tip poked ~7 units into the shape.
    window.__ob.loadModel({ nodes: [
      { id: 'at', shape: 'bpmn-task-user', x: 40, y: 200, width: 100, height: 80, label: 'Tạo Lead' },
      { id: 'ads', shape: 'bpmn-data-store', x: 300, y: 100, width: 60, height: 50, label: 'Lead Odoo' },
    ], edges: [{ id: 'aa', source: 'at', sourcePort: 'right', target: 'ads', targetPort: 'left', kind: 'association' }] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    const line = [...document.querySelectorAll('[data-cell-id="aa"] path')].find((p) => p.getAttribute('marker-end'));
    const id = line.getAttribute('marker-end').match(/#([^)]+)/)[1];
    const bb = document.getElementById(id).querySelector('path').getBBox();
    // marker drawn rotate(180): tip = -bb.x must not pass the line end (x ≤ 0 + stroke)
    assert(Math.abs(bb.x) <= 0.5, 'arrowhead offset from line end: ' + bb.x);
  });

  // ── Sub-process expanded ⇄ collapsed (bpmn-js "change type"; ⊞ is only a marker) ──
  const clickToggle = async (id) => {
    g().resetSelection([cell(id)]);
    await tick(80);
    const b = [...document.querySelectorAll('.lk-cb-btn')].find((x) => /^(Mở rộng tại chỗ|Thu gọn)/.test(x.title));
    if (!b) throw new Error('no expand / collapse button on ' + id);

      { id: 'fa', shape: 'bpmn-task', x: 100, y: 100, width: 100, height: 60, label: 'Gọi khách hàng' },
      { id: 'fb', shape: 'bpmn-task', x: 400, y: 100, width: 100, height: 60, label: 'Báo giá' },
      { id: 'fc', shape: 'bpmn-task', x: 100, y: 300, width: 100, height: 60, label: 'Khách xác nhận' },
    ], edges: [] });
    g().zoomTo(1); g().translate(0, 0);
    await tick(300);
    g().container.dispatchEvent(new KeyboardEvent('keydown', { key: 'f', code: 'KeyF', keyCode: 70, ctrlKey: true, bubbles: true, cancelable: true }));
    await tick(100);
    const box = document.querySelector('.lk-search');
    assert(box, 'no search box after Ctrl+F');
    const inp = box.querySelector('input');
    inp.value = 'khach';
    inp.dispatchEvent(new Event('input'));
    await tick(100);
    const sel = () => g().getSelectedCells().map((c) => c.id).join();
    assert(sel() === 'fa', 'first match: ' + sel());
    assert(box.textContent.includes('1/2'), 'counter: ' + box.textContent);
    inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    await tick(100);
    assert(sel() === 'fc', 'next match: ' + sel());
    inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true }));
    await tick(100);
    assert(sel() === 'fa', 'previous match: ' + sel());
    inp.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await tick(100);
    assert(!document.querySelector('.lk-search'), 'box still open after Esc');
  });

  // ── Loading a board is not an edit: undo never goes back past it ──
  const boardA = () => ({ nodes: [t('ua', 100, 100), t('ub', 300, 100)], edges: [{ id: 'uab', source: 'ua', target: 'ub' }] });
  const boardB = () => ({ nodes: [t('uc', 100, 300)], edges: [] });
  const ids = () => window.__ob.getModel().nodes.map((n) => n.id).sort().join();
  const undoAll = async () => { for (let i = 0; i < 20 && g().canUndo(); i++) { window.__ob.undo(); await tick(20); } };

  await run('opening a board leaves nothing to undo', async () => {
    window.__ob.loadModel(boardA());
    await tick(400);                         // past the deferred auto-grow after load
    assert(!g().canUndo(), 'undo available right after opening');
    await undoAll();
    assert(ids() === 'ua,ub', 'board after undo: [' + ids() + ']');
  });

  await run('undo after an edit stops at the board as it was opened', async () => {
    window.__ob.loadModel(boardA());
    await tick(400);
    cell('ua').setPosition(150, 180);
    await undoAll();
    assert(ids() === 'ua,ub', 'board after undo: [' + ids() + ']');
    const p = cell('ua').getPosition();
    assert(p.x === 100 && p.y === 100, 'node not back where it was opened: ' + JSON.stringify(p));
  });

  await run('loading another board over an edited one: undo does not bring the old one back or empty it', async () => {
    window.__ob.loadModel(boardA());
    await tick(400);
    cell('ua').setPosition(150, 180);
    window.__ob.loadModel(boardB());         // Board ⇄ native, another diagram, reload from disk
    await tick(400);
    assert(!g().canUndo(), 'undo available after loading another board');
    await undoAll();
    assert(ids() === 'uc', 'board after undo: [' + ids() + ']');
  });

  const failed = results.filter(r => !r.ok).length;
  w(failed ? `${failed} FAILED` : 'ALL PASS', failed ? 'fail' : 'pass');
  window.__results = results;
})();
</script>
